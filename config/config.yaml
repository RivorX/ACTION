# Konfiguracja modelu Temporal Fusion Transformer
# Ten plik zawiera ustawienia dla modelu, treningu, danych i predykcji

# Nazwa modelu
model_name: Gen5_3_1

# Ustawienia modelu
model:
  # Parametry modelu
  max_prediction_length: 30      # Maksymalna długość predykcji (dni)
  min_encoder_length: 50         # Minimalna długość danych wejściowych
  max_encoder_length: 90        # Maksymalna długość danych historycznych
  hidden_size: 128               # Rozmiar warstwy ukrytej
  attention_head_size: 4         # Liczba głowic uwagi
  dropout: 0.3                   # Współczynnik dropout dla stabilności
  learning_rate: 0.0005           # Współczynnik uczenia
  lstm_layers: 2                 # Liczba warstw LSTM
  use_quantile_loss: true        # Włączenie straty kwantylowej
  quantiles: [0.1, 0.5, 0.9]     # Kwantyle dla predykcji
  weight_start: 1.0              # Początkowa waga czasowa
  weight_end: 1.2                # Końcowa waga czasowa
  directional_weight: 0.3        # Waga dla directional accuracy
  log_interval: 10               # Interwał logowania
  embedding_sizes:               # Rozmiary embeddingów dla zmiennych kategorycznych
    Sector: [12, 5]
    Day_of_Week: [7, 5]
    Month: [12, 5]
  sectors:                       # Lista sektorów
    - Technology
    - Healthcare
    - Financials
    - Consumer Discretionary
    - Consumer Staples
    - Energy
    - Utilities
    - Industrials
    - Materials
    - Communication Services
    - Real Estate
    - Unknown
  # Zakresy hiperparametrów dla optymalizacji Optuna
  tuning:
    min_hidden_size: 32
    max_hidden_size: 128
    min_lstm_layers: 1
    max_lstm_layers: 3
    min_attention_head_size: 1
    max_attention_head_size: 6
    min_learning_rate: 0.0001
    max_learning_rate: 0.01
    min_dropout: 0.1
    max_dropout: 0.3
    min_hidden_continuous_size: 16
    max_hidden_continuous_size: 128
    min_weight_start: 1.0
    max_weight_start: 1.2
    min_weight_end: 1.3
    max_weight_end: 2.0
    min_directional_weight: 0.01
    max_directional_weight: 0.5

# Ustawienia treningu
training:
  max_epochs: 100                # Maksymalna liczba epok
  batch_size: 256                # Rozmiar partii dla treningu
  early_stopping_patience: 10    # Cierpliwość dla wczesnego zatrzymania
  reduce_lr_patience: 3          # Cierpliwość dla redukcji współczynnika uczenia
  reduce_lr_factor: 0.6          # Czynnik redukcji współczynnika uczenia
  weight_decay: 0.01              # Współczynnik weight decay
  gradient_clip_val: 0.5         # Wartość klipu gradientu
  monitor_metric: val_loss       # Metryka do monitorowania (val_loss lub val_combined_metric)
  optuna_trials: 10              # Liczba prób dla optymalizacji hiperparametrów

# Ustawienia walidacji
validation:
  enable_detailed_validation: false  # Czy włączyć szczegółowe logowanie walidacji
  max_validation_batches_to_log: 3   # Maksymalna liczba batchy walidacyjnych do logowania

# Ustawienia predykcji
prediction:
  years: 3                      # Liczba lat historycznych do pobierania danych
  batch_size: 128               # Rozmiar partii dla predykcji

# Ustawienia danych
data:
  raw_data_path: data/stock_data.csv            # Ścieżka do surowych danych giełdowych
  processed_data_path: data/processed_dataset.pt # Ścieżka do przetworzonego datasetu
  normalizers_path: data/normalizers.pkl        # Ścieżka do zapisanych normalizerów
  tickers_file: config/tickers_with_names.yaml   # Plik z tickerami i nazwami spółek
  benchmark_tickers_file: config/benchmark_tickers.yaml # Plik z tickerami benchmarkowymi

# Ścieżki do zapisu
paths:
  models_dir: models             # Katalog do zapisu modeli